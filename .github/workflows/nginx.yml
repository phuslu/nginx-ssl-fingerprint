name: nginx

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openssl: [openssl-3.5.6, openssl-3.6.2]
        nginx: [release-1.29.8, release-1.30.0, release-1.30.7, release-1.31.7, release-1.31.9]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: nginx-ssl-fingerprint
      - name: Dependency
        run: |
          sudo apt update -y
          sudo apt-get install -y libpcre2-dev
      - name: Clone
        run: |
          git clone -b ${{ matrix.openssl }} --depth=1 https://github.com/openssl/openssl
          git clone -b ${{ matrix.nginx }} --depth=1 https://github.com/nginx/nginx
      - name: Patch
        run: |
          patch -p1 -d openssl < nginx-ssl-fingerprint/patches/${{ matrix.openssl }}.patch
          patch -p1 -d nginx < nginx-ssl-fingerprint/patches/${{ matrix.nginx }}.patch
      - name: Build
        run: |
          cd nginx
          ASAN_OPTIONS=symbolize=1 ./auto/configure --with-openssl=$(pwd)/../openssl --add-module=$(pwd)/../nginx-ssl-fingerprint --with-http_ssl_module --with-stream_ssl_module --with-debug --with-stream --with-http_v2_module --with-cc-opt="-fsanitize=address -O -fno-omit-frame-pointer -DNGX_DEBUG_PALLOC=1" --with-ld-opt="-L/usr/local/lib -Wl,-E -lasan"
          make -j$(nproc)
      - name: Test HTTP module
        run: |
          nohup nginx/objs/nginx -p . -c nginx-ssl-fingerprint/nginx.conf </dev/null &>nginx.log &
          sleep 2
          curl -kv https://127.0.0.1:4433
          cat nginx.log
      - name: Test Stream module
        run: |
          nohup nginx/objs/nginx -p . -c nginx-ssl-fingerprint/nginx.conf </dev/null &>nginx.log &
          sleep 2
          curl -kv https://127.0.0.1:4443
          cat nginx.log
      - name: Fuzzing
        run: |
          git clone https://github.com/tlsfuzzer/tlsfuzzer
          cd tlsfuzzer
          python3 -m venv venv
          venv/bin/pip install --pre tlslite-ng
          for file in scripts/*.py; do
            PYTHONPATH=. venv/bin/python $file || true
            pgrep nginx
          done
          curl -kv -sSf https://127.0.0.1:4433
          curl -kv -sSf https://127.0.0.1:4443

  # BoringSSL / AWS-LC, no library patch. Neither has a stable ABI: bump the
  # pinned tags deliberately.
  tests-boringssl-awslc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tls:
          - {name: boringssl, repo: google/boringssl, tag: 0.20261105.0}
          - {name: aws-lc, repo: aws/aws-lc, tag: v5.14.0}
        nginx: [release-1.29.8, release-1.30.0, release-1.30.7, release-1.31.7, release-1.31.9]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: nginx-ssl-fingerprint
      - name: Dependency
        run: |
          sudo apt update -y
          sudo apt-get install -y cmake ninja-build golang perl libpcre2-dev zlib1g-dev
      - name: Clone
        run: |
          git clone -b ${{ matrix.tls.tag }} --depth=1 https://github.com/${{ matrix.tls.repo }} tls
          git clone -b ${{ matrix.nginx }} --depth=1 https://github.com/nginx/nginx
      # -Wno-error=stringop-overflow: GCC 15 on ubuntu-latest flags
      # BoringSSL's keccak.cc.inc left_encode() (false positive), and the
      # library builds with -Werror.
      - name: Build TLS library
        run: |
          cmake -S tls -B tls/build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$(pwd)/tls-install" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_C_FLAGS=-Wno-error=stringop-overflow -DCMAKE_CXX_FLAGS=-Wno-error=stringop-overflow
          ninja -C tls/build
          cmake --install tls/build
      - name: Patch
        run: |
          patch -p1 -d nginx < nginx-ssl-fingerprint/patches/${{ matrix.nginx }}.patch
      - name: Build
        run: |
          cd nginx
          ASAN_OPTIONS=symbolize=1 ./auto/configure --add-module="$(pwd)/../nginx-ssl-fingerprint" --with-http_ssl_module --with-stream_ssl_module --with-debug --with-stream --with-http_v2_module --with-cc-opt="-I$(pwd)/../tls-install/include -fsanitize=address -O -fno-omit-frame-pointer -DNGX_DEBUG_PALLOC=1" --with-ld-opt="-L$(pwd)/../tls-install/lib -Wl,-E -lasan -Wl,--start-group -lssl -lcrypto -lstdc++ -Wl,--end-group -lpthread"
          make -j"$(nproc)"
          objs/nginx -V 2>&1 | grep -E 'BoringSSL|AWS-LC'
      - name: Start nginx
        run: |
          nohup nginx/objs/nginx -p . -c nginx-ssl-fingerprint/nginx.conf </dev/null &>nginx.log &
          sleep 2
          pgrep nginx
      - name: Test HTTP module
        run: |
          curl -kv -sSf -o http.txt https://127.0.0.1:4433
          cat http.txt
          grep -E '^ja3: [0-9]+,' http.txt
          grep -E '^ja3_hash: [0-9a-f]{32}$' http.txt
          grep -E '^ja4: t[0-9]{2}' http.txt
      # Same curl, same ClientHello: stream must equal HTTP.
      - name: Test Stream module
        run: |
          curl -kv -sSf -o stream.txt https://127.0.0.1:4443
          cat stream.txt
          grep -E '^ja3: [0-9]+,' stream.txt
          grep -E '^ja3_hash: [0-9a-f]{32}$' stream.txt
          grep -E '^ja4: t[0-9]{2}' stream.txt
          diff <(grep -E '^(ja3|ja3_hash|ja4|greased): ' http.txt) <(grep -E '^(ja3|ja3_hash|ja4|greased): ' stream.txt)
      # tests/run.sh BASE_TESTS minus repro_86.py and test_issue_92.py: both
      # libraries reject their truncated ECH body before any callback (stock
      # nginx too).
      - name: Tests
        run: |
          mkdir -m 1777 asan-suite
          base=$(sed -n 's/^BASE_TESTS="\(.*\)"$/\1/p' nginx-ssl-fingerprint/tests/run.sh)
          TESTS=$(echo "$base" | tr ' ' '\n' | grep -v -x -e repro_86.py -e test_issue_92.py | tr '\n' ' ')
          export TESTS
          bash nginx-ssl-fingerprint/tests/run.sh
        env:
          NGINX_BIN: ${{ github.workspace }}/nginx/objs/nginx
          TEST_PORT: "5433"
          STREAM_PORT: "5443"
          ASAN_OPTIONS: "detect_leaks=0:log_path=${{ github.workspace }}/asan-suite/asan"
      # tlsfuzzer ClientHello scripts on the stream listener.
      - name: Fuzzing
        run: |
          cd nginx-ssl-fingerprint/tests
          if ! test -x .venv/bin/python || ! test -d tlsfuzzer/scripts; then
            echo "tests/.venv or tests/tlsfuzzer missing: the Tests step (tests/run.sh) bootstraps them" >&2
            exit 1
          fi
          for name in invalid-client-hello invalid-client-hello-w-record-overflow truncating-of-client-hello empty-extensions extensions large-hello large-number-of-extensions point-extension sig-algs alpn-negotiation tls13-unrecognised-groups; do
            test -f "tlsfuzzer/scripts/test-$name.py"
            PYTHONPATH=tlsfuzzer .venv/bin/python "tlsfuzzer/scripts/test-$name.py" -h 127.0.0.1 -p 4443 || true
            pgrep nginx
          done
          curl -kv -sSf https://127.0.0.1:4443
      - name: Check nginx
        run: |
          pgrep nginx
          if grep -E -A 30 'AddressSanitizer|exited on signal|exited with code' nginx.log; then
            exit 1
          fi
          if grep -r -E -A 30 'AddressSanitizer' asan-suite; then
            exit 1
          fi
      - name: Show nginx log
        if: failure()
        run: |
          tail -n 200 nginx.log 2>/dev/null || true
          cat asan-suite/* 2>/dev/null || true
